name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: jq empty manifest.json
      - name: Run model tests
        run: node --test tests/model.test.js
      - name: Check discovery shell syntax
        run: |
          bash -n discover-sensors.sh
          bash -n tests/discovery.test.sh
      - name: Run discovery tests
        run: bash tests/discovery.test.sh
